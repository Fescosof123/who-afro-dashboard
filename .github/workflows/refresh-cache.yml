name: Refresh RSS Cache

# Runs hourly on GitHub's clean IPs (not blocked by ReliefWeb / OCHA / WHO CDNs).
# Fetches every blocked RSS feed, writes the cache JSON files, commits them back,
# and pushes so deployments always have a fresh snapshot even when runtime egress
# is blocked by upstream providers.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch RSS feeds and update cache files
        id: refresh
        run: node scripts/refresh-rss-cache.js
        continue-on-error: true

      - name: Check for a new ACMAD continental hazard bulletin
        run: |
          command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          node scripts/refresh-acmad.js
        continue-on-error: true

      - name: Refresh strategic data and record this month's KPI snapshot
        run: node scripts/refresh-strategic.js
        continue-on-error: true
        env:
          HDX_HAPI_APP_IDENTIFIER: ${{ secrets.HDX_HAPI_APP_IDENTIFIER }}

      - name: Commit updated cache files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json || true
          git diff --cached --quiet && echo "No changes - skipping commit" && exit 0
          git commit -m "Auto-refresh: data cache update $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Someone may have pushed while this job ran; replay on top of it.
          git pull --rebase origin main
          git push
